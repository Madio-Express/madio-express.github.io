  <!-- Instant splash shown before the Flutter engine boots, so the user never
       stares at a blank white page while main.dart.js + CanvasKit download.
       It is a brand loader, not a page skeleton: logo (or initial) inside a
       pulsing ring in the store's color, name, slogan and a progress line.
       A grid skeleton used to live here, but it promised a product layout
       that a services store, a landing page or a single-product store never
       shows. Identity hydrates from (fastest wins) the edge-proxy seed
       (window.__storeSeed, custom domains), localStorage (repeat visits) or
       the store prefetch below (first visit). Mirrored by Flutter's
       StoreBrandShell so the hand-off is seamless. Removed on
       `flutter-first-frame` (script at end of body). -->
  <style>
    #app-splash {
      --bl-brand: #5B9FED;
      --bl-ink: #241B27;
      --bl-caption: #8E8593;
      --bl-line: #EDE9EF;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FFFFFF;
      overflow: hidden;
      transition: opacity 0.35s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #app-splash.app-splash--hidden {
      opacity: 0;
      pointer-events: none;
    }

    #app-splash .bl-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    #app-splash .bl-mark {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app-splash .bl-ring {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid var(--bl-brand);
      opacity: 0;
      animation: bl-pulse 2.2s ease-out infinite;
    }

    @keyframes bl-pulse {
      0% { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    #app-splash .bl-disc {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #F1EFF2;
      border: 1px solid var(--bl-line);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    #app-splash .bl-disc.bl-disc--initial {
      background: var(--bl-brand);
    }

    #app-splash .bl-initial {
      display: none;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 34px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1;
    }

    #app-splash .bl-disc.bl-disc--initial .bl-initial { display: block; }

    #app-splash .bl-disc img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: #FFFFFF;
    }

    #app-splash .bl-disc img.bl-logo--in { opacity: 1; }

    #app-splash .bl-name-ph {
      width: 150px;
      height: 14px;
      border-radius: 7px;
      background: #F1EFF2;
      margin-top: 18px;
    }

    #app-splash .bl-name {
      display: none;
      margin-top: 18px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--bl-ink);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      visibility: hidden;
      height: 0;
      margin-top: 0;
    }

    #app-splash .bl-name.bl--on {
      visibility: visible;
      height: auto;
      margin-top: 18px;
    }

    #app-splash .bl-slogan {
      display: none;
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--bl-caption);
      max-width: 100%;
    }

    #app-splash .bl-slogan.bl--on { display: block; }

    #app-splash .bl-bar {
      position: relative;
      width: 160px;
      height: 2px;
      margin-top: 28px;
      background: var(--bl-line);

    #app-splash .bl-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 56px;
      height: 100%;
      background: var(--bl-brand);

    @keyframes bl-sweep {

      100% { transform: translateX(160px); }
    }

    #app-splash .bl-caption {

      font-size: 12px;
      letter-spacing: 0.6px;

    @media (prefers-reduced-motion: reduce) {
      #app-splash .bl-ring { animation: none; opacity: 0.35; }
      #app-splash .bl-bar-fill { animation: none; width: 100%; opacity: 0.6; }

  <script>
    // Backwards compatibility with old links: on custom domains (edge-proxy)
    // the app uses path URLs, so a shared link like /#/store_57/product_196
    // is converted to /store_57/product_196 before Flutter reads the route.
    // On GitHub Pages (static hosting, no rewrites) the hash is kept.
    (function () {
      if (window.location.host === 'madio-express.github.io') return;
      var hash = window.location.hash;
      if (hash && hash.indexOf('#/') === 0) {
        window.history.replaceState(null, '', hash.slice(1) + window.location.search);
      }
    })();
  </script>

  <script>
    // Store prefetch: start the store GET at HTML-parse time, in parallel with
    // main.dart.js download + parse + engine boot. Without this, the store
    // fetch only starts once Dart is running (~0.5s in), so the visible
    // "content ready" moment pays engine boot + fetch SEQUENTIALLY. The Dart
    // side (lib/data/store_prefetch_web.dart) consumes window.__storePrefetch
    // one-shot; if anything here fails, promises resolve to null and Dart
    // falls back to its normal network path (retry + typed errors intact).
    // Must run AFTER the hash->path script above so pathname is canonical.
    (function () {
      var API = 'https://virtual-store-api-gateway-609036400323.us-central1.run.app';
      var host = window.location.host;

      // Never let a hung prefetch block the app: settle with null after 8s and
      // let the Dart retry path (15s per attempt, cold-start aware) take over.
      function withTimeout(promise, ms) {
        return new Promise(function (resolve) {
          var t = setTimeout(function () { resolve(null); }, ms);
          promise.then(
            function (v) { clearTimeout(t); resolve(v); },
            function () { clearTimeout(t); resolve(null); }
          );
        });
      }

      function fetchText(url) {
        // No headers: keeps this a "simple" CORS request (no preflight).
        return withTimeout(
          fetch(url).then(function (r) { return r.ok ? r.text() : null; }),
          8000
        );
      }

      // Mirror of extractStoreId in lib/presentation/util/route_parser.dart:
      // first path (or hash) segment whose tail after the LAST underscore is
      // numeric (teregalo_55, pet_store_55, store_30).
      function storeIdFromUrl() {
        var route = window.location.pathname;
        if (window.location.hash.indexOf('#/') === 0) route = window.location.hash.slice(1);
        route = route.split('?')[0];
        var segs = route.split('/');
        for (var i = 0; i < segs.length; i++) {
          var m = /_(\d+)$/.exec(segs[i]);
          if (m) return m[1];
        }
        return null;
      }

      // github.io root is the mall (no store); localhost is dev. Any other
      // host is a custom domain that maps to one store via the resolve endpoint.
      var isCustomDomain = host.indexOf('github.io') === -1 &&
        host.indexOf('localhost') === -1 &&
        host.indexOf('127.0.0.1') === -1;

      var slugId = storeIdFromUrl();

      var storeIdPromise;
      if (slugId) {
        storeIdPromise = Promise.resolve(slugId);
      } else if (isCustomDomain) {
        storeIdPromise = fetchText(API + '/store/store/resolve?host=' + encodeURIComponent(host))
          .then(function (t) {
            if (!t) return null;
            try {
              var d = JSON.parse(t);
              var id = (d.storeId != null) ? d.storeId : d.id;
              return (id != null) ? String(id) : null;
            } catch (e) { return null; }
          });
      } else {
        storeIdPromise = Promise.resolve(null);
      }

      var storePromise = storeIdPromise.then(function (id) {
        if (!id) return null;
        return fetchText(API + '/store/public/store/' + id).then(function (t) {
          return t ? { id: id, json: t } : null;
        });
      });

      // Products and campaigns are also public reads on the boot critical
      // path: the shop controller needs the product list before anything
      // renders, and a /campaign_N deep link additionally needs the active
      // campaigns to resolve its destination. Measured without prefetch they
      // started at ~1.3s and ~5.5s respectively; here they start with the
      // store fetch.
      var productsPromise = storeIdPromise.then(function (id) {
        if (!id) return null;
        return fetchText(API + '/warehouse/productsmodule/store/' + id + '/catalog/public')
          .then(function (t) { return t ? { id: id, json: t } : null; });
      });

      var campaignsPromise = storeIdPromise.then(function (id) {
        if (!id) return null;
        return fetchText(API + '/store/campaigns/active/' + id)
          .then(function (t) { return t ? { id: id, json: t } : null; });
      });

      window.__storePrefetch = {
        // Promise<string|null>: store id from the URL slug or host resolve.
        storeId: storeIdPromise,
        // Promise<{id, json}|null>: raw JSON text of GET /store/public/store/{id}.
        store: storePromise,
        // Promise<{id, json}|null>: GET .../catalog/public.
        products: productsPromise,
        // Promise<{id, json}|null>: GET /store/campaigns/active/{id}.
        campaigns: campaignsPromise,
        // One-shot flags set by the Dart consumers (a second read must go to
        // the network, e.g. when the user navigates to another store).
        storeIdConsumed: false,
        storeConsumed: false,
        productsConsumed: false,
        campaignsConsumed: false,
        // localStorage key part for the splash identity cache below.
        cacheKey: slugId ? 'store:' + slugId : 'host:' + host
      };
    })();
  </script>

  <script>
    // Deploy stamp: tool/deploy_web.ps1 replaces the placeholder with a unique
    // build id (git sha + timestamp) and writes the same id to
    // build_version.txt. Together they give cache-proof updates: the entrypoint
    // is fetched as main.dart.js?v=<id> (URL changes every deploy, so the HTTP
    // cache can never serve a stale bundle) and the update checker at the
    // bottom compares this baked id against the deployed one. In local dev the
    // placeholder stays as-is and both mechanisms turn themselves off.
    var appBuildId = '0f68f28-20261107151808';
    var appBuildIdIsReal = appBuildId.indexOf('__') !== 0;
  </script>

  <script>
    // Defensive: drop any previously-installed Flutter service worker. A stale
    // SW cache served customers a pre-security-migration main.dart.js that called
    // now-dead authenticated endpoints (/store/store/{id}, vercel supply-chain)
    // → 401/CORS → store failed to load on first try. This storefront is
    // online-only, so we no longer register a SW (see the loader below); already
    // poisoned clients are healed by the killswitch flutter_service_worker.js
    // (tool/disable_service_worker.js). No reload here to avoid loops.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <!-- MercadoPago SDK is loaded ON DEMAND (only when the user reaches the MP
       payment step), not on every visit. This keeps ~3 script downloads and a
       device-fingerprint XHR off the initial cold start, which most visitors
       (contra-entrega / transferencia) never need. window.loadMercadoPagoSdk()
       is idempotent and resolves once window.MercadoPagoBridge is ready; the
       payment brick widget triggers it and waits before rendering. -->
  <script>
    (function () {
      var mpPromise = null;
      function loadScript(src, attrs) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          if (attrs) {
            Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
          }
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('Failed to load ' + src)); };
          document.head.appendChild(s);
        });
      }
      // Order matters: SDK first, then security.js (device fingerprint), then
      // the bridge (reads the SDK global and defines window.MercadoPagoBridge).
      window.loadMercadoPagoSdk = function () {
        if (mpPromise) return mpPromise;
        mpPromise = loadScript('https://sdk.mercadopago.com/js/v2')
          .then(function () {
            return loadScript('https://www.mercadopago.com/v2/security.js', { view: 'checkout' });
          })
          .then(function () { return loadScript('mercadopago_bridge.js'); })
          .catch(function (e) { mpPromise = null; throw e; });
        return mpPromise;
      };
    })();
  </script>

<body>
  <!-- Instant splash (styled in <head>). Painted by the browser immediately,
       removed once Flutter rasterizes its first frame. Brand loader: logo or
       initial in a pulsing ring, store name, slogan, progress line. -->
  <div id="app-splash" aria-hidden="true">
    <div class="bl-wrap">
      <div class="bl-mark">
        <div class="bl-ring"></div>
        <div class="bl-disc" id="bl-disc">
          <span class="bl-initial" id="bl-initial"></span>
          <img id="bl-logo" alt="">
        </div>
      </div>
      <div class="bl-name-ph" id="bl-name-ph"></div>
      <div class="bl-name" id="bl-name"></div>
      <div class="bl-slogan" id="bl-slogan"></div>
      <div class="bl-bar"><div class="bl-bar-fill"></div></div>
      <div class="bl-caption">Cargando…</div>
    </div>
  </div>

  <script>
    // Splash identity: paint the store's name, logo, slogan and brand color
    // inside the loader so the wait reads as "this store is opening" instead
    // of a generic loader. Three sources, fastest wins:
    //   1. window.__storeSeed, injected by the edge-proxy on custom domains
    //      (available at parse time, 0ms). Only trusted when it is the store
    //      the URL points to.
    //   2. localStorage (identity seen on a previous visit) -> instant.
    //   3. The store prefetch above -> first visit, usually well before the
    //      first Flutter frame. Also refreshes the cache.
    // Only textContent (XSS-safe), an https logo URL and a validated hex
    // color are ever used. Flutter reads the same cache/seed through
    // readCachedSplashIdentity (lib/data/store_prefetch_web.dart).
    (function () {
      var pf = window.__storePrefetch;
      var KEY = 'splash_identity_v1:' + (pf && pf.cacheKey ? pf.cacheKey : 'host:' + window.location.host);
      var slugId = pf && pf.cacheKey && pf.cacheKey.indexOf('store:') === 0 ? pf.cacheKey.slice(6) : null;

      // '#rrggbb' from '#rrggbb', 'rrggbb' or '0xAARRGGBB'; null otherwise.
      function hex(c) {
        if (!c) return null;
        var s = String(c).trim().replace(/^0x/i, '').replace(/^#/, '');
        if (s.length === 8) s = s.slice(2);
        return /^[0-9a-fA-F]{6}$/.test(s) ? '#' + s : null;
      }

      // Perceived brightness 0-255 (YIQ) to pick a readable ring/initial.
      function brightness(h) {
        var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
        return (r * 299 + g * 587 + b * 114) / 1000;
      }

      function apply(identity) {
        if (!identity) return;
        var root = document.getElementById('app-splash');
        if (!root) return;
        var name = identity.name || '';
        var brand = hex(identity.primaryColor);
        if (brand) {
          // A near-white brand would vanish on the white page: use ink there.
          root.style.setProperty('--bl-brand', brightness(brand) > 230 ? '#241B27' : brand);
        }
        if (name) {
          var ph = document.getElementById('bl-name-ph');
          var nm = document.getElementById('bl-name');
          if (ph && nm) {
            nm.textContent = name;
            ph.style.display = 'none';
            nm.classList.add('bl--on');
          }
          var ini = document.getElementById('bl-initial');
          var disc = document.getElementById('bl-disc');
          if (ini && disc && !disc.classList.contains('bl-disc--logo')) {
            ini.textContent = name.charAt(0).toUpperCase();
            ini.style.color = brand && brightness(brand) <= 150 ? '#FFFFFF' : '#241B27';
            disc.classList.add('bl-disc--initial');
          }
        }
        if (identity.slogan) {
          var sl = document.getElementById('bl-slogan');
          if (sl) { sl.textContent = identity.slogan; sl.classList.add('bl--on'); }
        }
        if (identity.logoUrl && /^https:\/\//i.test(identity.logoUrl)) {
          var img = document.getElementById('bl-logo');
          if (img && img.getAttribute('src') !== identity.logoUrl) {
            img.onload = function () {
              img.classList.add('bl-logo--in');
              var d = document.getElementById('bl-disc');
              if (d) { d.classList.add('bl-disc--logo'); d.classList.remove('bl-disc--initial'); }
            };
            img.src = identity.logoUrl;
          }
        }
      }

      function fromStore(s) {
        return {
          name: s.name || '',
          logoUrl: s.logoUrl || '',
          slogan: s.slogan || '',
          primaryColor: hex(s.primaryColor) || ''
        };
      }

      function same(a, b) {
        return !!a && !!b && a.name === b.name && a.logoUrl === b.logoUrl &&
          (a.slogan || '') === (b.slogan || '') && (a.primaryColor || '') === (b.primaryColor || '');
      }

      function save(identity, id) {
        try {
          var payload = JSON.stringify(identity);
          localStorage.setItem(KEY, payload);
          // Also key by store id: a root visit on a custom domain caches
          // under host:<domain>, but Flutter then rewrites the URL to
          // /name_<id>, so the first refresh looks up store:<id>. Writing
          // both makes identity instant from the very first refresh.
          if (id != null) localStorage.setItem('splash_identity_v1:store:' + id, payload);
        } catch (e) {}
      }

      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}

      // 1. Proxy seed, when it describes the store in the URL.
      var seed = window.__storeSeed;
      var seedOk = seed && typeof seed === 'object' && (!slugId || String(seed.id) === slugId);
      if (seedOk) {
        var fromSeed = fromStore(seed);
        apply(fromSeed);
        if (!same(cached, fromSeed)) { save(fromSeed, seed.id); cached = fromSeed; }
      } else {
        // 2. Last visit.
        apply(cached);
      }

      // 3. Fresh store JSON: fills the first visit and refreshes the cache.
      if (pf && pf.store && typeof pf.store.then === 'function') {
        pf.store.then(function (r) {
          if (!r || !r.json) return;
          var s;
          try { s = JSON.parse(r.json); } catch (e) { return; }
          var identity = fromStore(s);
          if (!identity.name && !identity.logoUrl) return;
          if (!same(cached, identity)) {
            apply(identity);
            save(identity, s.id);
          }
        });
      }
    })();
  </script>

  <!-- Firebase JS is auto-injected by the firebase_core / firebase_auth Flutter
       plugins (v3/v5). The old manual 8.6.1 compat <script> tags + config block
       were unused (initializeApp was already commented out) and only added two
       blocking downloads on every load, so they were removed. -->

  <script>
    // Remove the instant splash as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;
      splash.classList.add('app-splash--hidden');
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 400);
    });
  </script>

  <script>
    window.addEventListener('load', function (ev) {
      // Download main.dart.js WITHOUT registering a service worker. Stale SW
      // caching is what served customers an outdated build after the security
      // migration; for an online-only storefront the offline cache isn't worth
      // breaking deploys. New visitors install no SW; deploys take effect on the
      // next load.
      _flutter.loader.loadEntrypoint({
        // Versioned URL = hard cache-bust on every deploy (see appBuildId).
        // Absolute path (leading slash): flutter.js resolves entrypointUrl with
        // `new URL(t, window.location)`, which IGNORES <base href="/"> and
        // resolves relative to the current URL's directory. On a cold load of a
        // multi-segment deep link (e.g. /store_55/product_172, shared via
        // WhatsApp or a refresh) a relative 'main.dart.js' resolves to
        // /store_55/main.dart.js → 404 and the app never boots. A root-absolute
        // path always resolves to /main.dart.js regardless of route depth.
        entrypointUrl: appBuildIdIsReal ? '/main.dart.js?v=' + appBuildId : '/main.dart.js',
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <script>
    // Auto-update WITHOUT a service worker. This storefront deliberately
    // registers none (a stale SW cache once served a broken build after the
    // security migration), so we can't rely on the SW update cycle. Instead
    // the page knows its own build id (appBuildId, baked at deploy) and
    // compares it against build_version.txt at the origin. The old approach
    // (ETag baseline read at load) could never detect that the PAGE ITSELF
    // was stale — this one can. Behavior:
    //   - stale detected at page load or when returning to the tab -> reload
    //     silently once (nothing in progress to lose; the cart persists).
    //   - stale detected mid-session (5-min poll) -> non-intrusive banner.
    //   - anti-loop guard: if we already auto-reloaded for a given remote id
    //     (Pages edge can serve the old index.html for up to ~10 min), fall
    //     back to the banner instead of reloading again.
    (function () {
      if (!appBuildIdIsReal) return; // local dev: no deploy stamp, no checker

      var RELOADED_KEY = 'app_update_reloaded_to';

      // A build id looks like "<git sha>-<yyyyMMddHHmmss>". Anything else is
      // NOT a version: custom domains sit behind the edge-proxy, whose SPA
      // fallback answered /build_version.txt with a full index.html before it
      // learned to pass .txt through — comparing that HTML against appBuildId
      // made the update banner permanent (2026-07-02). Never trust content
      // that doesn't match the shape.
      var BUILD_ID_SHAPE = /^[0-9a-f]{6,40}-\d{8,17}$/i;

      function fetchDeployedId() {
        // Cache-busting query + no-store defeats both the browser and the CDN
        // edge cache, so we always read the version currently at the origin.
        return fetch('build_version.txt?_v=' + Date.now(), { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) return null;
            return res.text().then(function (t) {
              var id = (t || '').trim();
              return BUILD_ID_SHAPE.test(id) ? id : null;
            });
          })
          .catch(function () { return null; });
      }

      function showUpdateBanner() {
        if (document.getElementById('app-update-banner')) return;
        var style = document.createElement('style');
        style.textContent =
          '#app-update-banner{position:fixed;left:50%;bottom:24px;' +
          'transform:translateX(-50%) translateY(160%);display:flex;align-items:center;' +
          'gap:14px;padding:12px 14px 12px 20px;border-radius:14px;background:#FFFFFF;' +
          'color:#2A2A2A;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
          'font-size:14px;box-shadow:0 10px 40px rgba(90,50,105,.25);' +
          'border:1px solid rgba(90,50,105,.18);z-index:2147483647;' +
          'transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px)}' +
          '#app-update-banner.app-update-banner--in{transform:translateX(-50%) translateY(0)}' +
          '#app-update-banner .aub-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
          '#app-update-banner .aub-reload{cursor:pointer;border:0;border-radius:9px;' +
          'padding:8px 16px;font-weight:600;font-size:14px;background:#5A3269;color:#fff}' +
          '#app-update-banner .aub-reload:hover{background:#6d3d80}' +
          '#app-update-banner .aub-close{cursor:pointer;border:0;background:transparent;' +
          'color:#9A8AA0;font-size:20px;line-height:1;padding:0 4px}' +
          '#app-update-banner .aub-close:hover{color:#2A2A2A}';
        document.head.appendChild(style);

        var bar = document.createElement('div');
        bar.id = 'app-update-banner';
        bar.setAttribute('role', 'status');
        bar.innerHTML =
          '<span class="aub-text">Hay una nueva versión disponible</span>' +
          '<button type="button" class="aub-reload">Actualizar</button>' +
          '<button type="button" class="aub-close" aria-label="Cerrar">×</button>';
        document.body.appendChild(bar);
        requestAnimationFrame(function () { bar.classList.add('app-update-banner--in'); });

        bar.querySelector('.aub-reload').addEventListener('click', function () {
          window.location.reload();
        });
        bar.querySelector('.aub-close').addEventListener('click', function () {
          bar.classList.remove('app-update-banner--in');
          setTimeout(function () { if (bar.parentNode) bar.remove(); }, 350);
        });
      }

      function tryAutoReload(remoteId) {
        var alreadyTried = null;
        try { alreadyTried = sessionStorage.getItem(RELOADED_KEY); } catch (e) {}
        if (alreadyTried === remoteId) {
          // We already reloaded for this deploy and still got the old page
          // (stale index.html at the edge). Don't loop — just offer the banner.
          showUpdateBanner();
          return;
        }
        try { sessionStorage.setItem(RELOADED_KEY, remoteId); } catch (e) {}
        window.location.reload();
      }

      // silent=true (page load / tab became visible): reload without asking.
      // silent=false (mid-session poll): show the banner, never yank the page.
      function check(silent) {
        fetchDeployedId().then(function (remoteId) {
          if (!remoteId || remoteId === appBuildId) return;
          if (silent) { tryAutoReload(remoteId); } else { showUpdateBanner(); }
        });
      }

      check(true);
      setInterval(function () { check(false); }, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check(true);
      });
    })();
  </script>
</body>

</html>
